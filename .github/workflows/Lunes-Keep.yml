name: Lunes Host 自动保活

on:
  schedule:
    # 每10天运行：1号、11号、21号 中午12:12 (北京时间)
    # UTC 时间 = 北京时间 - 8小时 = 04:12
    - cron: '12 4 1,11,21 * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: 执行保活
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 需要写权限才能提交时间戳文件
      actions: write
    concurrency:
      group: lunes-keepalive
      cancel-in-progress: false

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          # 必须拿到完整历史，且允许后续 push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install seleniumbase>=4.25.0 pyvirtualdisplay>=3.0 requests>=2.31.0

      - name: 设置代理
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            echo "❌ 代理设置失败，发送通知..."
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d text="❌ Lunes Host 自动保活失败：代理不可用" \
              --max-time 10 || true
            exit 1
          fi

      - name: 执行保活
        env:
          LUNES: ${{ secrets.LUNES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: python scripts/Lunes-Keep.py

#      - name: 上传截图
#        uses: actions/upload-artifact@v4
#        if: always()
#        with:
#          name: screenshots-${{ github.run_number }}
#          path: output/screenshots/
#          retention-days: 3

      # ========== 成功后写时间戳并提交，防止仓库因无活动被禁用 Actions ==========
      - name: 更新时间戳文件（防止 Actions 被自动禁用）
        if: success()
        run: |
          # 写当前 UTC 时间到文件
          echo "Last successful run: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/last-run.txt
          echo "Run ID: ${{ github.run_id }}" >> .github/last-run.txt
          echo "Triggered by: ${{ github.event_name }}" >> .github/last-run.txt
          echo "Actor: ${{ github.actor }}" >> .github/last-run.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/last-run.txt
          # 只有内容变化时才提交
          if git diff --staged --quiet; then
            echo "时间戳无变化，跳过提交"
          else
            git commit -m "chore: update last-run timestamp [skip ci]"
            git push
          fi

      - name: 清理旧运行
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
